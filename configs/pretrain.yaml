seed: 42
device: auto
data:
  manifest: results/audit/pretraining.jsonl
  image_size: 224
  num_workers: 0
  pin_memory: false
  drop_last: true
model:
  name: resnet50
  pretrained: false
  embedding_dim: 2048
  projection_dim: 128
training:
