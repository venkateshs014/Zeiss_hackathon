# First real RFMiD SimCLR experiment. CUDA is enabled opportunistically by the
# training code; this machine currently has a CPU-only PyTorch build.
seed: 42
device: auto
data:
  manifest: results/audit/pretraining.jsonl
  image_size: 224
  num_workers: 0
  pin_memory: false
  drop_last: true
model:
  name: resnet50
  pretrained: false
  embedding_dim: 2048
  projection_dim: 128
training:
  batch_size: 4
  epochs: 10
  learning_rate: 0.0003
  weight_decay: 0.0001
  temperature: 0.2
  amp: true
  output_dir: checkpoints/pretrain_rfmid_10ep_seed42_cpu
  resume: null
